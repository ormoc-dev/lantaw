<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="Personal movie library PWA" />
    <script>
      // Fix asset paths for root deploys (Vercel/Netlify) and XAMPP (/movie/)
      (function () {
        var path = location.pathname.replace(/\/index\.html$/, "");
        var base = path === "/movie" || path.indexOf("/movie/") === 0 ? "/movie/" : "/";
        var b = document.createElement("base");
        b.href = base;
        document.head.prepend(b);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <title>Movie</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
