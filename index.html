<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff0a43" />
    <meta name="description" content="Lantaw — Filipino movies, TV shows, and anime" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lantaw" />
    <link rel="icon" type="image/png" href="public/icons/LOGO.png" />
    <link rel="apple-touch-icon" href="public/icons/LOGO.png" />
    <script>
      // Root on Vercel; /movie/ on XAMPP localhost
      (function () {
        var path = location.pathname.replace(/\/index\.html$/, "");
        var base =
          path === "/movie" || path.indexOf("/movie/") === 0 ? "/movie/" : "/";
        var b = document.createElement("base");
        b.href = base;
        document.head.prepend(b);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest?v=36" />
    <link rel="stylesheet" href="src/styles/main.css?v=36" />
    <title>Lantaw</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/main.js?v=36"></script>
  </body>
</html>
